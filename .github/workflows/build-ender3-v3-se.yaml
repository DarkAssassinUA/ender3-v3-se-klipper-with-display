name: Build Ender 3 V3 SE Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3

    - name: Configure Klipper for Ender 3 V3 SE
      run: |
        cat <<EOF > .config
        CONFIG_LOW_LEVEL_OPTIONS=y
        CONFIG_MACH_STM32=y
        CONFIG_MACH_STM32F103=y
        CONFIG_STM32_FLASH_START_7000=y
        CONFIG_STM32F103GD_DISABLE_SWD=y
        CONFIG_STM32_SERIAL_USART1=y
        CONFIG_SERIAL_BRIDGE=y
        CONFIG_ENABLE_SERIAL_BRIDGE_USART2=y
        EOF
        make olddefconfig

    - name: Build firmware
      run: make -j$(nproc)

    - name: Upload Klipper Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ender3-v3-se-klipper-firmware
        path: out/klipper.bin

    - name: Prepare Release Info
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        BUILD_DATE=$(TZ='Europe/Moscow' date +'%d.%m.%Y %H:%M:%S')
        COMMIT_HASH=$(git rev-parse --short HEAD)
        TAG_NAME="build-$(date +'%Y%m%d%H%M%S')-${COMMIT_HASH}"
        
        echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
        echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
        
        cat <<EOF > release_notes.md
        ### Прошивка Klipper для Ender 3 V3 SE
        
        **Дата сборки:** ${BUILD_DATE} (UTC+3)
        
        **Основано на коммите:** ${COMMIT_HASH}
        
        **Параметры конфигурации сборщика:**
        - **Архитектура:** STM32 (STM32F103)
        - **Смещение загрузчика (Bootloader offset):** 28KiB
        - **Фикс для GD32:** Отключение SWD при запуске (Disable SWD at startup)
        - **Интерфейс связи:** Serial (на USART1 PA10/PA09)
        - **Мод экрана:** Serial Bridge включен на USART2
        EOF

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: Сборка прошивки ${{ env.BUILD_DATE }}
        body_path: release_notes.md
        files: out/klipper.bin
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
